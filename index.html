<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>laaafffffoooo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --brown-dark: #1c120c;
    --brown: #3a2417;
    --gold: #d9a441;
    --gold-bright: #f0c674;
    --cream: #efe2c9;
    --line: rgba(217,164,65,0.25);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 0%, rgba(217,164,65,0.08), transparent 60%),
      radial-gradient(circle at 80% 100%, rgba(217,164,65,0.06), transparent 60%),
      var(--brown-dark);
    color: var(--cream);
    font-family:'Bricolage Grotesque', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }

  .card{
    width:100%;
    max-width: 420px;
  }

  .disc{
    width:96px;
    height:96px;
    margin: 0 auto 20px;
    border-radius:50%;
    background:
      radial-gradient(circle at center, var(--brown-dark) 0 14px, transparent 15px),
      repeating-radial-gradient(circle at center, var(--gold) 0 1.5px, transparent 1.5px 7px);
    border: 2px solid var(--line);
    animation: spin 9s linear infinite;
  }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  h1{
    text-align:center;
    font-size: 2rem;
    font-weight:800;
    letter-spacing: -0.02em;
    color: var(--gold-bright);
    margin-bottom: 6px;
  }

  .tag{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    opacity:0.75;
    margin-bottom: 32px;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  a.link{
    display:flex;
    align-items:center;
    gap:14px;
    padding: 15px 18px;
    background: rgba(239,226,201,0.03);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration:none;
    color: var(--cream);
    transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
  }

  a.link:hover, a.link:focus-visible{
    border-color: var(--gold);
    background: rgba(217,164,65,0.08);
    transform: translateX(3px);
    outline: none;
  }

  a.link .icon{
    width: 22px;
    height: 22px;
    flex-shrink:0;
    stroke: var(--gold-bright);
  }

  a.link .label{
    font-weight:600;
    font-size: 0.98rem;
  }

  a.link .sub{
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--gold);
    opacity:0.6;
    margin-left:auto;
  }

  .song{
    margin-top: 28px;
    padding: 16px 18px;
    border: 1px dashed var(--line);
    border-radius: 10px;
    display:flex;
    align-items:center;
    gap: 14px;
  }

  .song .bars{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:20px;
  }

  .song .bars span{
    width:3px;
    background: var(--gold-bright);
    display:block;
    animation: eq 1.1s ease-in-out infinite;
  }
  .song .bars span:nth-child(1){ height:40%; animation-delay: 0s; }
  .song .bars span:nth-child(2){ height:100%; animation-delay: 0.15s; }
  .song .bars span:nth-child(3){ height:65%; animation-delay: 0.3s; }
  .song .bars span:nth-child(4){ height:85%; animation-delay: 0.45s; }

  @keyframes eq{
    0%, 100%{ transform: scaleY(0.4); }
    50%{ transform: scaleY(1); }
  }

  .song-text{ flex:1; }
  .song-text .title{ font-weight:600; font-size:0.92rem; color:var(--gold-bright); }
  .song-text .artist{ font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--gold); opacity:0.7; }

  .song a{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    color: var(--gold-bright);
    text-decoration:none;
    border: 1px solid var(--gold);
    padding: 6px 12px;
    border-radius: 20px;
    white-space:nowrap;
    transition: background 0.2s ease;
  }
  .song a:hover{ background: rgba(217,164,65,0.15); }

  footer{
    text-align:center;
    margin-top: 28px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    color: var(--gold);
    opacity: 0.4;
    letter-spacing: 0.1em;
  }

  @media (prefers-reduced-motion: reduce){
    .disc{ animation:none; }
    .song .bars span{ animation:none; }
  }

  #yt-player{
    position:absolute;
    width:1px; height:1px;
    opacity:0;
    pointer-events:none;
  }

  .music-toggle{
    position: fixed;
    top: 18px;
    right: 18px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--brown);
    border: 1px solid var(--gold);
    color: var(--gold-bright);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size: 1.1rem;
    z-index: 10;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .music-toggle:hover{ background: rgba(217,164,65,0.15); transform: scale(1.05); }
  .music-toggle:focus-visible{ outline: 2px solid var(--gold-bright); outline-offset: 2px; }

  /* spotlight that follows cursor */
  .spotlight{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(circle 260px at var(--mx,50%) var(--my,50%), rgba(217,164,65,0.10), transparent 70%);
    transition: background 0.05s linear;
  }

  .card{ position: relative; z-index: 2; }

  /* embers */
  .ember{
    position: fixed;
    bottom: -10px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--gold-bright), var(--gold) 60%, transparent 70%);
    pointer-events:none;
    z-index: 1;
    opacity: 0;
    animation: rise linear infinite;
  }

  @keyframes rise{
    0%{ transform: translateY(0) translateX(0); opacity: 0; }
    10%{ opacity: 0.8; }
    90%{ opacity: 0.5; }
    100%{ transform: translateY(-110vh) translateX(var(--drift, 20px)); opacity: 0; }
  }

  /* shimmer title */
  h1{
    background: linear-gradient(100deg, var(--gold) 20%, var(--gold-bright) 40%, #fff6df 50%, var(--gold-bright) 60%, var(--gold) 80%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 5s linear infinite;
  }

  @keyframes shimmer{
    to{ background-position: -220% center; }
  }

  /* tilt hover on link cards */
  a.link{
    transform-style: preserve-3d;
    will-change: transform;
  }

  @media (hover:hover){
    a.link:hover{
      box-shadow: 0 10px 24px -12px rgba(217,164,65,0.35);
    }
  }

  @media (prefers-reduced-motion: reduce){
    .ember{ display:none; }
    h1{ animation:none; }
  }
</style>
</head>
<body>
  <div class="spotlight" id="spotlight"></div>
  <button class="music-toggle" id="musicToggle" aria-label="تشغيل الموسيقى">▶</button>
  <div id="yt-player"></div>

  <div class="card">
    <div class="disc" aria-hidden="true"></div>
    <h1>laaafffffoooo</h1>
    <div class="tag">find me everywhere</div>

    <div class="links">
      <a class="link" href="https://www.instagram.com/laaaaa_fffffooooo" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        <span class="label">Instagram</span>
        <span class="sub">@laaaaa_fffffooooo</span>
      </a>

      <a class="link" href="https://www.tiktok.com/@giduejdigkejdcufuzue" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></svg>
        <span class="label">TikTok</span>
        <span class="sub">@giduejdigkejdcufuzue</span>
      </a>

      <a class="link" href="https://steamcommunity.com/profiles/76561199886852538" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M15.5 8.5 4.5 15"/></svg>
        <span class="label">Steam</span>
        <span class="sub">profile</span>
      </a>

      <a class="link" href="#" onclick="navigator.clipboard.writeText('lafffffff_ooo'); this.querySelector('.sub').textContent='copied!'; return false;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.3 4.3c-1.6-.7-3.3-1.2-5-1.5l-.3.6c1.5.4 2.9 1 4.2 1.7"/><path d="M3.7 4.3c1.6-.7 3.3-1.2 5-1.5l.3.6c-1.5.4-2.9 1-4.2 1.7"/><rect x="5" y="6" width="14" height="12" rx="4"/><circle cx="9.5" cy="12" r="1.2"/><circle cx="14.5" cy="12" r="1.2"/></svg>
        <span class="label">Discord</span>
        <span class="sub">lafffffff_ooo · tap to copy</span>
      </a>
    </div>

    <div class="song">
      <div class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="song-text">
        <div class="title">Golden Brown</div>
        <div class="artist">The Stranglers</div>
      </div>
      <a href="https://www.youtube.com/watch?v=NNACikbchFM" target="_blank" rel="noopener">▶ play</a>
    </div>

    <footer>made with a lil golden brown</footer>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let ytPlayer;
    let isPlaying = false;
    const toggleBtn = document.getElementById('musicToggle');

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '1',
        width: '1',
        videoId: 'NNACikbchFM',
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          loop: 1,
          playlist: 'NNACikbchFM'
        },
        events: {
          onReady: () => { toggleBtn.disabled = false; }
        }
      });
    }

    toggleBtn.addEventListener('click', () => {
      if (!ytPlayer || !ytPlayer.playVideo) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
        toggleBtn.textContent = '▶';
      } else {
        ytPlayer.playVideo();
        toggleBtn.textContent = '❚❚';
      }
      isPlaying = !isPlaying;
    });

    // cursor spotlight
    const spotlight = document.getElementById('spotlight');
    window.addEventListener('pointermove', (e) => {
      spotlight.style.setProperty('--mx', e.clientX + 'px');
      spotlight.style.setProperty('--my', e.clientY + 'px');
    });

    // floating embers
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduceMotion) {
      const emberCount = 22;
      for (let i = 0; i < emberCount; i++) {
        const ember = document.createElement('div');
        ember.className = 'ember';
        const size = 2 + Math.random() * 4;
        ember.style.width = size + 'px';
        ember.style.height = size + 'px';
        ember.style.left = Math.random() * 100 + 'vw';
        ember.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
        const duration = 6 + Math.random() * 8;
        ember.style.animationDuration = duration + 's';
        ember.style.animationDelay = (Math.random() * duration) + 's';
        document.body.appendChild(ember);
      }
    }

    // subtle tilt on link cards
    document.querySelectorAll('a.link').forEach((el) => {
      el.addEventListener('mousemove', (e) => {
        const rect = el.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        el.style.transform = `perspective(400px) rotateX(${y * -4}deg) rotateY(${x * 4}deg) translateX(3px)`;
      });
      el.addEventListener('mouseleave', () => {
        el.style.transform = '';
      });
    });
  </script>
</body>
</html>
